[project]
name = "pyokka-runtime"
version = "0.3.0"
description = "Pyokka's Python runtime: instrumentation, tracing, value serialization, runner (stdlib only)."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
pyokka = "pyokka_runtime.__main__:main"

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyokka_runtime"
module-root = ""

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "pytest>=8",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
